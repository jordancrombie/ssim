openapi: 3.0.3
info:
  title: SSIM Agent Commerce API
  description: |
    Store API for AI agents implementing the SimToolBox Agent Commerce Protocol (SACP).

    Enables agents to:
    - Discover store capabilities via UCP
    - Browse and search products
    - Create and manage checkout sessions
    - Complete purchases with wallet payment tokens
    - Check order status

    ## Authentication
    All authenticated endpoints require a Bearer token from WSIM.
    Obtain credentials by registering with WSIM using a pairing code.

    ## Discovery Flow
    1. `GET /.well-known/ucp` - Discover store and wallet provider info
    2. Register with WSIM using pairing code
    3. Exchange credentials for access token via WSIM OAuth
    4. Use access token to call SSIM agent endpoints

    ## Checkout Flow (Required Steps)
    1. `POST /api/agent/v1/sessions` - Create session with cart items
    2. `PATCH /api/agent/v1/sessions/{id}` - Add buyer info and fulfillment address
    3. `POST /api/agent/v1/sessions/{id}/complete` - Complete checkout
       - If step-up required: Poll `GET /api/agent/v1/sessions/{id}` until status changes
    4. `GET /api/agent/v1/orders/{id}` - Check order status

    **Important**: The `next_step` field in responses guides agents on what to do next.

    ## AI Discovery Endpoints
    - `/.well-known/ai-plugin.json` - ChatGPT plugin manifest
    - `/.well-known/mcp-server` - MCP (Model Context Protocol) server discovery
  version: 2.2.3
  contact:
    name: SimToolBox
    url: https://ssim.banksim.ca

servers:
  - url: https://ssim-dev.banksim.ca
    description: Development
  - url: https://ssim.banksim.ca
    description: Production

tags:
  - name: Discovery
    description: Store capability discovery
  - name: Products
    description: Product catalog operations
  - name: Checkout
    description: Checkout session management
  - name: Orders
    description: Order status and history

paths:
  /.well-known/ucp:
    get:
      operationId: discoverStore
      summary: Discover store capabilities
      description: |
        Universal Commerce Protocol (UCP) discovery endpoint.
        Returns merchant info, API endpoints, and wallet provider details.
        No authentication required.
      tags:
        - Discovery
      responses:
        '200':
          description: Store capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UcpConfig'
              example:
                version: "1.0"
                merchant:
                  id: ssim_ssim-dev_banksim_ca
                  name: SSIM Dev Store
                  description: Welcome to SSIM Dev Store
                  logo: https://ssim-dev.banksim.ca/logo.png
                  url: https://ssim-dev.banksim.ca
                capabilities:
                  discovery: true
                  cart: true
                  checkout: true
                  order_status: true
                  returns: false
                api:
                  base_url: https://ssim-dev.banksim.ca/api/agent/v1
                  authentication: bearer
                  endpoints:
                    products: /products
                    sessions: /sessions
                    orders: /orders
                payment_methods:
                  supported: [card, wallet]
                  wallets: [wsim]
                wallet_provider:
                  name: WSIM
                  base_url: https://wsim-dev.banksim.ca
                  discovery_url: https://wsim-dev.banksim.ca/.well-known/agent-api
                  registration_url: https://wsim-dev.banksim.ca/api/agent/v1/access-request
                openapi_url: /.well-known/openapi.json

  /api/agent/v1/products:
    get:
      operationId: listProducts
      summary: List product catalog
      description: Browse products with optional filtering and pagination
      tags:
        - Products
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: limit
          in: query
          description: Maximum results (default 20, max 100)
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            default: 0
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: minPrice
          in: query
          description: Minimum price in cents
          schema:
            type: integer
        - name: maxPrice
          in: query
          description: Maximum price in cents
          schema:
            type: integer
      responses:
        '200':
          description: Product list with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /api/agent/v1/products/search:
    get:
      operationId: searchProducts
      summary: Search products by query
      tags:
        - Products
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (searches name, description, category)
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  query:
                    type: string
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Missing query parameter

  /api/agent/v1/products/{product_id}:
    get:
      operationId: getProduct
      summary: Get product details
      tags:
        - Products
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

  /api/agent/v1/sessions:
    post:
      operationId: createSession
      summary: Create checkout session
      description: Create a new checkout session with items to purchase
      tags:
        - Checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                buyer:
                  $ref: '#/components/schemas/Buyer'
                fulfillment:
                  $ref: '#/components/schemas/Fulfillment'
      responses:
        '201':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid items or product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: item_unavailable
                message: Some products are not available
                unavailable_items: ["prod_123", "prod_456"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/agent/v1/sessions/{session_id}:
    get:
      operationId: getSession
      summary: Get checkout session
      tags:
        - Checkout
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Session not found

    patch:
      operationId: updateSession
      summary: Update checkout items
      tags:
        - Checkout
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                buyer:
                  $ref: '#/components/schemas/Buyer'
                fulfillment:
                  $ref: '#/components/schemas/Fulfillment'
      responses:
        '200':
          description: Updated checkout session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

    delete:
      operationId: cancelSession
      summary: Cancel checkout session
      tags:
        - Checkout
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: cancelled
                  message:
                    type: string

  /api/agent/v1/sessions/{session_id}/complete:
    post:
      operationId: completeCheckout
      summary: Complete checkout with payment
      description: |
        Submit payment token to complete the purchase.
        The payment_token must be obtained from the wallet provider (WSIM).
      tags:
        - Checkout
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_token:
                  type: string
                  description: Payment token from WSIM (JWT)
                mandate_id:
                  type: string
                  description: Optional mandate ID
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - order_id
                properties:
                  status:
                    type: string
                    enum: [completed]
                  order_id:
                    type: string
                  transaction_id:
                    type: string
                  next_step:
                    type: string
                    description: Guidance on what to do next
                    example: GET /api/agent/v1/orders/{order_id} to check order status
        '202':
          description: Step-up authorization required
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - step_up_id
                  - next_step
                properties:
                  status:
                    type: string
                    enum: [awaiting_authorization]
                  step_up_id:
                    type: string
                  next_step:
                    type: string
                    description: Guidance on what to do next
                    example: Poll GET /api/agent/v1/sessions/{id} every 2-5 seconds until status changes
        '400':
          description: Payment declined or session not ready
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/DeclinedResponse'

  /api/agent/v1/orders/{order_id}:
    get:
      operationId: getOrder
      summary: Get order status
      description: Get details of an order created by this agent
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Access token from wallet provider (WSIM).
        Obtain via WSIM's /api/agent/v1/oauth/token endpoint.

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_token:
              value:
                error: missing_token
                message: Authorization header with Bearer token required
            invalid_token:
              value:
                error: invalid_token
                message: Token is invalid or expired
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - retry_after
            properties:
              error:
                type: string
                enum: [rate_limit_exceeded]
              message:
                type: string
              retry_after:
                type: integer
                description: Seconds to wait before retrying
          example:
            error: rate_limit_exceeded
            message: Too many requests. Please slow down.
            retry_after: 60
    ServiceUnavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            api_disabled:
              value:
                error: agent_api_disabled
                message: Agent API is not enabled for this store
            spec_unavailable:
              value:
                error: OpenAPI specification not available

  schemas:
    UcpConfig:
      type: object
      properties:
        version:
          type: string
          example: "1.0"
        merchant:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            description:
              type: string
            logo:
              type: string
              format: uri
            url:
              type: string
              format: uri
        capabilities:
          type: object
          description: Object with boolean flags
          properties:
            discovery:
              type: boolean
            cart:
              type: boolean
            checkout:
              type: boolean
            order_status:
              type: boolean
            returns:
              type: boolean
        api:
          type: object
          properties:
            base_url:
              type: string
              format: uri
            authentication:
              type: string
              enum: [bearer]
            endpoints:
              type: object
              properties:
                products:
                  type: string
                sessions:
                  type: string
                orders:
                  type: string
        payment_methods:
          type: object
          properties:
            supported:
              type: array
              items:
                type: string
            wallets:
              type: array
              items:
                type: string
        wallet_provider:
          type: object
          description: Wallet provider discovery info
          properties:
            name:
              type: string
            base_url:
              type: string
              format: uri
            discovery_url:
              type: string
              format: uri
            registration_url:
              type: string
              format: uri
            description:
              type: string
        openapi_url:
          type: string
          description: Path to OpenAPI specification
        policies:
          type: object
          properties:
            terms:
              type: string
              format: uri
            privacy:
              type: string
              format: uri
        session_config:
          type: object
          properties:
            expiration_minutes:
              type: integer
            expiration_range:
              type: object
              properties:
                min:
                  type: integer
                max:
                  type: integer

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: object
          properties:
            amount:
              type: number
              format: decimal
              description: Price in dollars
            currency:
              type: string
              example: CAD
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              alt:
                type: string
        inventory:
          type: object
          properties:
            available:
              type: boolean
            quantity:
              type: integer
              nullable: true
        categories:
          type: array
          items:
            type: string
        schema_org:
          type: object
          description: Schema.org Product markup

    CartItem:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1

    Buyer:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    Fulfillment:
      type: object
      properties:
        type:
          type: string
          enum: [shipping, pickup]
        address:
          type: object
          properties:
            street:
              type: string
            city:
              type: string
            state:
              type: string
            postal_code:
              type: string
            country:
              type: string

    Session:
      type: object
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
            - cart_building
            - awaiting_buyer_info
            - ready_for_payment
            - awaiting_authorization
            - processing
            - completed
            - cancelled
            - failed
            - expired
        next_step:
          type: string
          nullable: true
          description: |
            Hints the agent on what action to take next based on current status.
            Examples:
            - cart_building: "PATCH /api/agent/v1/sessions/{id} with buyer and fulfillment info"
            - ready_for_payment: "POST /api/agent/v1/sessions/{id}/complete to checkout"
            - awaiting_authorization: "Poll GET /api/agent/v1/sessions/{id} every 2-5 seconds until status changes"
            - completed: "GET /api/agent/v1/orders/{order_id} to check order status"
        cart:
          type: object
          nullable: true
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  product_id:
                    type: string
                  name:
                    type: string
                  quantity:
                    type: integer
                  unit_price:
                    type: number
                  subtotal:
                    type: number
            subtotal:
              type: number
            tax:
              type: number
            shipping:
              type: number
              nullable: true
            total:
              type: number
            currency:
              type: string
        buyer:
          $ref: '#/components/schemas/Buyer'
        fulfillment:
          $ref: '#/components/schemas/Fulfillment'
        payment:
          type: object
          nullable: true
        messages:
          type: array
          items:
            type: object
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        order_id:
          type: string
        status:
          type: string
          enum:
            - pending
            - authorized
            - declined
            - failed
            - processing
            - shipped
            - delivered
            - cancelled
        items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
              name:
                type: string
              quantity:
                type: integer
              unit_price:
                type: number
              subtotal:
                type: number
        subtotal:
          type: number
        currency:
          type: string
        transaction_id:
          type: string
          nullable: true
          description: Payment transaction reference
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Machine-readable error code
          enum:
            - missing_token
            - invalid_token
            - authentication_error
            - agent_api_disabled
            - store_context_missing
            - item_unavailable
            - session_not_ready
            - session_expired
            - session_not_editable
            - session_not_cancellable
            - payment_token_failed
            - invalid_payment_token
            - payment_processing_error
            - not_implemented
        message:
          type: string
          description: Human-readable error description
        unavailable_items:
          type: array
          items:
            type: string
          description: List of unavailable product IDs (only for item_unavailable error)

    DeclinedResponse:
      type: object
      description: Payment declined or failed response
      required:
        - status
        - order_id
        - message
      properties:
        status:
          type: string
          enum: [declined, failed]
        order_id:
          type: string
        message:
          type: string
          description: Decline or failure reason
        next_step:
          type: string
          description: Guidance on what to do next
          example: Create a new session to retry with different payment method
